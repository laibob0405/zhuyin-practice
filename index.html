<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>小一國語互動學習卷</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: 一張紙本考卷，黑板綠卷頭，一次一題，老師紅筆批改 */
:root{
  --k-bg:#2b1a5a;--k-fg:#fff;--k-soft:#b7a9e0;--k-panel:#fff;--k-ink:#1b1238;--k-track:#50398f;--k-time:#ffd23f;--k-red:#d6304a;--k-blue:#1f6fd1;--k-yellow:#e7ab12;--k-green:#2f8f2a;
  --board:#1f4d3e; --on-board:#f2f7ee; --on-board-soft:#bcd3c3;
  --bg:#e7efe6; --paper:#fbfdf8; --ink:#1d2b25; --soft:#5a6b62;
  --line:#c5d3c6; --grid:#dbe5da; --pencil:#f4bd2a; --on-pencil:#2b2305;
  --red:#d3302a; --red-wash:#fde9e6; --ok-wash:#fff5f2;
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","Noto Sans TC","Microsoft JhengHei",serif;
  --ui:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --board:#143529; --on-board:#eaf3e8; --on-board-soft:#a4c0ae;
  --bg:#101a16; --paper:#1a2621; --ink:#ecf3ec; --soft:#a5b6ab;
  --line:#3b4d44; --grid:#2c3b34; --pencil:#f4bd2a; --on-pencil:#2b2305;
  --red:#ff7a70; --red-wash:#3b2220; --ok-wash:#33241f; color-scheme:dark}}
:root[data-theme="dark"]{
  --board:#143529; --on-board:#eaf3e8; --on-board-soft:#a4c0ae;
  --bg:#101a16; --paper:#1a2621; --ink:#ecf3ec; --soft:#a5b6ab;
  --line:#3b4d44; --grid:#2c3b34; --pencil:#f4bd2a; --on-pencil:#2b2305;
  --red:#ff7a70; --red-wash:#3b2220; --ok-wash:#33241f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.sheet{max-width:680px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
header{background:var(--board);color:var(--on-board);padding:18px 20px 16px;display:grid;gap:12px}
.head-top{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:baseline}
h1{font-family:var(--kai);font-size:28px;line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
.scope{font-size:13px;color:var(--on-board-soft);letter-spacing:.04em}
.name{display:flex;align-items:center;gap:8px;font-size:14px}
.name input{width:9em;max-width:100%;font:inherit;font-family:var(--kai);font-size:18px;padding:0 4px;background:transparent;color:inherit;border:0;border-bottom:1.5px solid var(--on-board-soft);border-radius:0}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tab{background:transparent;color:var(--on-board);border:1px solid var(--on-board-soft);border-radius:4px;padding:6px 4px;font-family:var(--kai);font-size:16px;line-height:1.3;min-height:58px;min-width:0}
.tab small{display:block;font-family:var(--ui);font-size:12px;color:var(--on-board-soft)}
.tab[aria-pressed="true"]{background:var(--pencil);color:var(--on-pencil);border-color:var(--pencil)}
.tab[aria-pressed="true"] small{color:var(--on-pencil)}
.prog{display:flex;gap:3px;padding:12px 20px 0}
.prog i{flex:1;height:8px;background:var(--grid);border-radius:1px}
.prog i.on{background:var(--board)} .prog i.miss{background:var(--pencil)} .prog i.now{background:var(--soft)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .prog i.on{background:var(--on-board-soft)}}
:root[data-theme="dark"] .prog i.on{background:var(--on-board-soft)}
main{padding:14px 20px 22px;display:grid;gap:16px}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.sec{font-family:var(--kai);font-size:22px;font-weight:700}
.count{font-size:14px;color:var(--soft);font-variant-numeric:tabular-nums}
.ask{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;min-height:120px}
.pic{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:76px;line-height:1.1}
.word{font-family:var(--kai);font-size:44px;line-height:1}
.speak{display:inline-flex;align-items:center;gap:8px;background:var(--pencil);color:var(--on-pencil);border:0;border-radius:40px;padding:12px 22px;font-weight:700;font-size:18px;min-height:56px}
.speak svg{width:24px;height:24px;fill:currentColor}
.hint{text-align:center;color:var(--soft);font-size:14px;margin:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.cell{position:relative;min-height:112px;display:flex;align-items:center;justify-content:center;font-family:var(--kai);font-size:50px;line-height:1.05;border:1.5px solid var(--line);border-radius:4px;padding:8px;
  background:linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat,var(--paper)}
button.cell:hover:not(:disabled){border-color:var(--ink)}
.cell:disabled{cursor:default}
.cell.good{background:var(--ok-wash);border-color:var(--red)}
.cell.good::after{content:"";position:absolute;inset:8px;margin:auto;width:84px;height:84px;max-width:100%;border:4px solid var(--red);border-radius:50%;transform:rotate(-8deg);animation:ring .3s ease-out}
.cell.bad{animation:shake .35s;opacity:.45}
.tone{font-size:21px;min-height:76px;font-family:var(--ui);font-weight:700;gap:6px;background:var(--paper)}
.tone b{font-family:var(--kai);font-size:34px;font-weight:400}
@keyframes ring{from{transform:rotate(-40deg) scale(.5);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.cell,.cell::after{animation:none!important}}
.zy{display:inline-flex;flex-direction:column;align-items:center;position:relative;padding-inline:.42em;line-height:1.02}
.zy .t{position:absolute;left:calc(50% + .46em);bottom:calc(var(--last) * 1em);font-size:.68em;line-height:1}
.slots{display:flex;flex-direction:column;align-items:center;gap:4px}
.slot{width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-family:var(--kai);font-size:44px;border:1.5px dashed var(--soft);border-radius:4px}
.slot.cur{border:2.5px solid var(--pencil)} .slot.full{border-style:solid;border-color:var(--line)}
.tiles .cell{min-height:80px;font-size:42px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.blank.small{width:52px;height:64px}
.sheet.playing header,.sheet.playing .prog,.sheet.playing footer{display:none}
.sheet.playing main{padding:0}
.stage{background:var(--k-bg);color:var(--k-fg);padding:16px;display:grid;gap:14px;min-height:560px;align-content:start}
.stage .say,.stage .sec{color:var(--k-fg)}
.khead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:18px}
.kexit{background:transparent;color:var(--k-fg);border:1px solid var(--k-soft);border-radius:4px;min-height:40px;padding:2px 10px;font-size:15px}
.kscore{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.ktimer{height:12px;background:var(--k-track);border-radius:6px;overflow:hidden}
.ktimer i{display:block;height:100%;background:var(--k-time);width:100%}
.kprompt{background:var(--k-panel);color:var(--k-ink);border-radius:8px;min-height:190px;padding:14px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;text-align:center}
.kprompt .pic{font-size:88px}
.kprompt .word{font-size:64px}
.ktag{background:var(--k-time);color:var(--k-ink);font-size:14px;border-radius:12px;padding:2px 10px;font-weight:700;width:max-content}
.duo{display:inline-flex;align-items:center;font-family:var(--kai);font-size:50px;line-height:1.1}
.duo .zy{font-size:.42em;padding-inline:.15em .5em}
.duo-line{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;align-items:center}
.ktiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ktile{position:relative;border:0;border-radius:8px;min-height:118px;padding:10px 10px 10px 42px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--kai);font-size:42px;color:#fff;transition:opacity .15s,transform .1s}
.ktile:hover:not(:disabled){transform:translateY(-2px)}
.ktile:disabled{cursor:default}
.ktile .shape{position:absolute;left:12px;top:10px;font-size:22px;line-height:1;font-family:system-ui,sans-serif}
.ktile .emoji{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:54px}
.ktile .zyrow.long{font-size:.6em}
.k0{background:var(--k-red)}.k1{background:var(--k-blue)}.k2{background:var(--k-yellow);color:#231a00}.k3{background:var(--k-green)}
.ktile.dim{opacity:.28}
.ktile.right{outline:5px solid var(--k-fg);outline-offset:-5px}
.kfb{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kfb .say{font-size:24px;margin:0}
.knext{background:var(--k-fg);color:var(--k-bg);border:0;border-radius:6px;padding:10px 24px;min-height:54px;font-size:20px;font-weight:700;margin-left:auto}
.klobby{justify-items:center;text-align:center;align-content:center}
.klobby .shapes{display:flex;gap:10px;font-size:44px;line-height:1;font-family:system-ui,sans-serif}
.kshape0{color:var(--k-red)}.kshape1{color:var(--k-blue)}.kshape2{color:var(--k-yellow)}.kshape3{color:var(--k-green)}
.kbig{font-family:var(--kai);font-size:40px}
.kstart{background:var(--k-yellow);color:#231a00;border:0;border-radius:8px;font-size:30px;font-weight:700;min-height:76px;padding:8px 44px;font-family:var(--kai)}
.board{display:grid;gap:8px;width:100%;max-width:520px}
.brow{display:flex;align-items:center;gap:10px;background:var(--k-panel);color:var(--k-ink);border-radius:6px;padding:8px 12px;font-size:20px}
.brow.me{outline:4px solid var(--k-yellow)}
.brow .rank{font-weight:700;min-width:1.2em}
.brow .who{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:30px}
.brow .pts{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.ktile{transition:none}}
@media (max-width:480px){.ktile{min-height:100px;font-size:34px;padding-left:34px}.kprompt{min-height:150px}.kprompt .pic{font-size:68px}.duo{font-size:38px}.kbig{font-size:30px}}
.ktile{flex-wrap:wrap}
.ktile [data-noz]{white-space:nowrap;font-size:.8em}
.kprompt .zyrow{flex-wrap:wrap;justify-content:center;max-width:100%}
.kprompt .zyrow.long{font-size:.68em}
.sceneimg{width:100%;max-width:560px;border-radius:10px;display:block}
.banimg{width:100%;max-height:170px;object-fit:cover;border-radius:6px;display:block}
.themebar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:30px;line-height:1.2}
.tabpic{display:block;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:26px;line-height:1.2}
.stage{position:relative;overflow:hidden}
.stage>*:not(.decor):not(.burst){position:relative;z-index:1}
.decor{position:absolute;inset:0;pointer-events:none;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:38px;line-height:1}
.decor span{position:absolute;opacity:.5}
.scene{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:60px;line-height:1.1}
.burst{position:absolute;inset:0;pointer-events:none;z-index:2;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:44px}
.burst span{position:absolute;bottom:-50px;animation:rise 1.1s ease-out forwards}
@keyframes rise{to{transform:translateY(-520px) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.burst{display:none}}
.cardback{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:44px}
@media (max-width:480px){.themebar{font-size:22px}.scene{font-size:44px}.decor{font-size:28px}.tabpic{font-size:22px}}
.rc.zc{display:inline-flex;align-items:center;font-family:var(--kai)}
.rc.zc .zy{font-size:max(.44em,11px);padding-inline:.12em .5em}
.rz{line-height:1.7}
.sheet{max-width:760px}
header{background:var(--k-bg);gap:10px;padding:14px 16px}
.head-top{align-items:center}
h1{font-size:26px}
.tabs{gap:5px}
.tab{min-height:64px;font-size:17px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:rgba(255,255,255,.14);border-radius:6px;padding:6px 12px;min-height:50px}
.banpics{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:26px;letter-spacing:2px;line-height:1.2}
.banname{font-family:var(--kai);font-size:20px;font-weight:700}
.banner small{font-size:15px;margin-left:auto}
.mode{min-height:48px;font-size:19px;font-family:var(--kai)}
.mode[aria-pressed="true"]{background:#fff;color:var(--k-bg);border-color:#fff;font-weight:700}
.mixrow{font-size:15px;min-height:28px}
main{padding:16px 18px 22px}
.sec{font-size:22px}
.gtop{padding-block:2px}
.kprompt .say{font-size:26px}
@media (max-width:480px){
  h1{font-size:21px}.head-top{gap:6px}
  .tabs{display:flex;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
  .tab{flex:0 0 112px;min-height:62px;font-size:15px;white-space:nowrap}
  .tab:last-child{flex-basis:140px}
  header .modes{grid-template-columns:1.5fr 1fr 1fr;gap:4px}
  header .mode{white-space:nowrap;font-size:14px;padding:0}
  .klobby .decor{display:none}
  .mode .rc.zc .zy{padding-inline:.05em .35em}
  .banpics{font-size:20px}.banname{font-size:17px}
  .mode{font-size:16px;min-height:46px}
  main{padding:12px 14px 18px}
  .sec{font-size:19px}
}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mode{background:transparent;color:var(--on-board);border:1px solid var(--on-board-soft);border-radius:4px;min-height:52px;font-size:20px}
.mode[aria-pressed="true"]{background:var(--on-board);color:var(--board);border-color:var(--on-board)}
.slots{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:10px}
.sgroup{display:flex;flex-direction:column;gap:4px}
.slot{width:52px;height:52px;font-size:36px}
.toneword{display:inline-flex;gap:6px}
.target{display:inline-flex;outline:3px solid var(--pencil);border-radius:4px;padding:4px}
.cell .zyrow.long{font-size:.56em}
.word.big .zyrow{flex-wrap:wrap;justify-content:center;max-width:100%}
.word.big .zyrow.long{font-size:.62em}
.gamelist{display:grid;gap:10px}
.gamebtn{display:flex;align-items:center;gap:16px;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:14px;min-height:92px;font-family:var(--kai);font-size:24px}
.gamebtn:hover{border-color:var(--ink)}
.gamebtn .pic{font-size:52px}
.gamebtn small{display:block;font-size:17px;color:var(--soft)}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.gback{background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px 12px;min-height:44px;font-size:17px}
.memgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card{min-height:112px;border:1.5px solid var(--line);border-radius:6px;background:var(--board);color:var(--on-board);font-family:var(--kai);font-size:38px;display:flex;align-items:center;justify-content:center;padding:4px}
.card.open,.card.done{background:var(--paper);color:var(--ink)}
.card.done{border-color:var(--red)}
.card .emoji{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:50px}
.card .zyrow{font-size:.8em}.card .zyrow.long{font-size:.5em}
.field{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hole{min-height:112px;border:0;border-radius:50% 50% 12px 12px;background:var(--grid);font-family:var(--kai);font-size:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.hole .mole{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:30px}
.hole.up{background:var(--pencil);color:var(--on-pencil);animation:pop .15s ease-out}
.hole.hit{background:var(--red-wash)}
@keyframes pop{from{transform:translateY(14px)}}
.track{display:grid;gap:6px;background:var(--grid);border-radius:6px;padding:8px 44px 8px 8px;position:relative}
.lane{position:relative;height:50px}
.runner{position:absolute;top:0;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:40px;line-height:1.2;transform:scaleX(-1);transition:left .35s}
.flag{position:absolute;right:6px;top:calc(50% - 24px);font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:36px}
.starline{font-size:20px;font-family:var(--kai)}
@media (prefers-reduced-motion:reduce){.hole,.runner{animation:none!important;transition:none!important}}
@media (max-width:480px){.memgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-height:90px}}
.zyrow{display:inline-flex;align-items:center;gap:4px}
.cell .zyrow{font-size:.82em}
.rz{line-height:1.5}
.rz .rc{vertical-align:middle;font-family:var(--kai);margin-block:.12em}
.rz .zy{font-family:var(--kai);font-size:max(.68em,13px);padding-inline:.2em .6em}
.scope,.tab,.name,.mixrow,.count,.hint,.review li{font-size:16px}
.tab small{font-size:14px}
.mixrow{display:flex;align-items:center;gap:8px;font-size:15px;min-height:32px;cursor:pointer}
.mixrow input{width:20px;height:20px;accent-color:var(--pencil)}
.ask.slim{min-height:0}
.word.big{font-size:64px}
.cell.solo{width:112px;min-height:112px;font-size:64px}
.cell.emoji{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:52px;background:var(--paper)}
.cell.chunk{min-height:92px;background:var(--paper)}
.cell.sel{border:3px solid var(--pencil)}
.ru{display:inline-flex;gap:2px;font-family:var(--kai);font-size:36px;line-height:1.1;padding-top:.3em}
.rc{display:inline-flex;align-items:center}
.rc .zy{font-size:.68em;padding-inline:.2em .6em}
.zy .d{position:absolute;top:-.72em;left:50%;transform:translateX(-50%);line-height:1}
.sent{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px}
.stop{font-family:var(--kai);font-size:30px}
.blank{display:inline-block;width:92px;height:54px;border:2.5px solid var(--pencil);border-radius:4px}
.passage{display:grid;gap:8px;justify-items:start;padding:14px;border:1px solid var(--line);border-radius:4px;min-width:0}
.qline{font-weight:700}
.ordrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;min-height:72px}
.oslot{min-width:92px;min-height:64px;display:inline-flex;align-items:center;justify-content:center;border:1.5px dashed var(--soft);border-radius:4px;padding:2px 6px}
.oslot.cur{border:2.5px solid var(--pencil)}.oslot.full{border:1.5px solid var(--line)}

    let t=shuffle(s.ch.map((c,n)=>n));if(t.every((v,n)=>v===n))t=[...t].reverse();
    qs.push({type:'order',s,tiles:t,filled:0,label:'排句子：'+sentText(s),ans:sentText(s)});
  });
  take(l.sents,1).forEach(s=>{const opts=shuffle([s.p,...take([...new Set([...pics,...voc.map(w=>w.p)])].filter(p=>p!==s.p),3)]);qs.push({type:'listenS',s,opts,good:opts.indexOf(s.p),label:'聽句子：'+sentText(s),ans:s.p,say:'答對了！'+sentText(s)})});
  take(l.sents,1).forEach(s=>{const same=Math.random()<.5;const shown=same?s.p:take(pics.filter(p=>p!==s.p),1)[0];qs.push({type:'tf',s,shown,good:same?0:1,label:'圖文判斷：'+sentText(s),ans:same?'一樣':'不一樣',say:'答對了！'})});
  take(l.reads,1).forEach(r=>{const opts=shuffle(r.opts);qs.push({type:'reading',r,opts,good:opts.indexOf(r.opts[0]),label:'短文：'+r.q,ans:txt(r.opts[0]),say:'答對了！答案是「'+txt(r.opts[0])+'」。'})});
  const twos=voc.filter(w=>w.ch.length===2);
  const toks=[];voc.forEach(w=>w.ch.forEach(t=>{if(!toks.some(u=>u.s===t.s&&u.t===t.t))toks.push({...t})}));
  const taught=new Set(l.pool.flatMap(x=>[...x[0]]));
  // 拼音練習：聲符加韻符，選出拼好的音。
  take(toks.filter(t=>[...t.s].length>1&&t.t<5),1).forEach(t=>{
    const cs=[...t.s],otherTone={s:t.s,t:t.t%4+1};
    const opts=shuffle([t,otherTone,...take(toks.filter(u=>u.s!==t.s&&[...u.s].length>1),2)]);
    qs.push({type:'combine',t,head:cs[0],rest:cs.slice(1).join(''),opts,good:opts.indexOf(t),label:'拼音練習',ans:t.s,say:'拼對了！'});
  });
  // 看圖填語詞：語詞少一個音，選出來。
  take(twos,1).forEach(w=>{
    const idx=Math.random()<.5?0:1,t=w.ch[idx];
    const opts=shuffle([t,...take(toks.filter(u=>u.s!==t.s),2)]);
    qs.push({type:'missing',w,idx,opts,good:opts.indexOf(t),label:'看圖填「'+w.c+'」',ans:w.c,say:'答對了！這是「'+w.c+'」。'});
  });
  // 連成語詞：前一個音連到後一個音。
  const links=[];shuffle(twos).forEach(w=>{if(links.length<3&&!links.some(u=>key(u.ch[0])===key(w.ch[0])||key(u.ch[1])===key(w.ch[1])))links.push(w)});
  qs.push({type:'linkword',links,right:shuffle(links),sel:null,done:0,label:'連成語詞',ans:links.map(w=>w.c).join('、')});
  // 把對的音選出來：音相近的兩個選一個。
  const CONF={'ㄅ':'ㄆ','ㄆ':'ㄅ','ㄉ':'ㄊ','ㄊ':'ㄉ','ㄋ':'ㄌ','ㄌ':'ㄋ','ㄍ':'ㄎ','ㄎ':'ㄍ','ㄐ':'ㄑ','ㄑ':'ㄐ','ㄓ':'ㄔ','ㄔ':'ㄓ','ㄕ':'ㄙ','ㄙ':'ㄕ','ㄗ':'ㄘ','ㄘ':'ㄗ','ㄈ':'ㄏ','ㄏ':'ㄈ','ㄇ':'ㄋ','ㄒ':'ㄕ'};
  take(voc,1).forEach(w=>{
    const idx=take(w.ch.map((t,n)=>t.t<5?n:-1).filter(n=>n>=0),1)[0],t=w.ch[idx];
    const swap=CONF[[...t.s][0]];
    const wrong=swap&&taught.has(swap)?{s:swap+[...t.s].slice(1).join(''),t:t.t}:{s:t.s,t:t.t%4+1};
    const opts=shuffle([t,wrong]);
    qs.push({type:'pair',w,idx,opts,good:opts.indexOf(t),label:'選出「'+w.c+'」的音',ans:w.c,say:'答對了！'});
  });
  // 圈一圈：把含有指定符號的音都點出來。
  const circleFrom=[...l.sym,...l.pool].map(x=>x[0]);
  const target=circleFrom.find(s=>{const n=toks.filter(t=>t.s.includes(s)).length;return n>=2&&n<toks.length-3})||circleFrom[0];
  const yes=take(toks.filter(t=>t.s.includes(target)),3),no=take(toks.filter(t=>!t.s.includes(target)),8-yes.length);
  qs.push({type:'circle',target,items:shuffle([...yes,...no]),found:0,need:yes.length,label:'圈出有「'+target+'」的音',ans:target});
  const order=Object.keys(SECTIONS);
  qs.sort((a,b)=>order.indexOf(a.type)-order.indexOf(b.type));
  return qs;
}
// 期中測驗：九課各出 4 題，12 種題型各出 3 題，再全部打散。
function buildExam(){
  const types=shuffle(Object.keys(SECTIONS));
  const exam=[];
  LESSONS.filter(l=>l.id!=='all').forEach((l,n)=>{
    const bank=build(l);
    for(let k=0;k<4;k++){
      const type=types[(n*4+k)%types.length];
      const q=take(bank.filter(x=>x.type===type),1)[0];
      exam.push({...q,from:l});
    }
  });
  return shuffle(exam);
}

function say(text){
  const hint=$('hint');
  const show=()=>{if(hint)hint.textContent='這台裝置無法播放中文語音，請家長念出：'+text};
  if(!('speechSynthesis' in window))return show();
  const v=speechSynthesis.getVoices();
  const voice=v.find(x=>/zh[-_]TW/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang));
  if(v.length&&!voice)return show();
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-TW';u.rate=.8;if(voice)u.voice=voice;
    u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted')show()};
    speechSynthesis.speak(u);
  }catch(e){show()}
}

    }
  }else if(b.dataset.opt!==undefined){
    const good=q.type==='listen'?b.dataset.opt===q.answer:b.dataset.opt===key(q.w);
    good?done(b,'答對了！'+(q.type==='pick'?q.w.c+'的注音就是這個。':'')):miss(b);
  }else if(b.dataset.tone){
    if(Number(b.dataset.tone)===q.tt)done(b,'答對了！這是'+TONES[q.tt-1][1]+'。');else miss(b);

      const slots=$('slots').querySelectorAll('.slot');
      slots[q.filled].textContent=b.dataset.tile;slots[q.filled].className='slot full';

      if(q.filled<ch.length){slots[q.filled].classList.add('cur');$('fb').innerHTML=''}
      else done(null,'拼好了！');
    }else miss(b);
  }

if('speechSynthesis' in window)speechSynthesis.getVoices();
let gTimers=[];
function stopGame(){gTimers.forEach(t=>{clearInterval(t);clearTimeout(t)});gTimers=[]}
const getStars=()=>Number(store.get('stars'))||0;
function addStars(n){store.set('stars',String(getStars()+n))}
function beep(ok){
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const a=new C(),o=a.createOscillator(),g=a.createGain();
    o.frequency.value=ok?880:220;g.gain.value=.06;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.15);
  }catch(e){}
}
const lessonVoc=()=>{const out=[];lesson.vocab.forEach(v=>{if(!out.some(u=>u.p===v.p||key(u)===key(v)))out.push(v)});return out};
const gameTop=text=>'<div class="gtop"><div class="sec">'+text+'</div><button class="gback" type="button" data-gback="1">回遊戲選單</button></div>';
function gameMenu(){
  stopGame();
  $('main').innerHTML='<div class="gtop"><div class="sec">選一個遊戲</div><div class="starline">你有 '+getStars()+' 顆星 ⭐</div></div><div class="gamelist">'+
   '<button class="gamebtn" type="button" data-game="memory"><span class="pic">🃏</span><span>翻牌配對<small>找出圖和注音</small></span></button>'+
   '<button class="gamebtn" type="button" data-game="mole"><span class="pic">'+themeOf().icon+'</span><span>注音打地鼠<small>打對的符號</small></span></button>'+
   '<button class="gamebtn" type="button" data-game="race"><span class="pic">🐢</span><span>龜兔賽跑<small>選對注音就往前走</small></span></button></div>';
}
function gameWin(game,stars,text){
  stopGame();
  if(stars)addStars(stars);
  beep(!!stars);
  $('main').innerHTML='<div class="result"><div class="pic">'+(stars?'🏆':'🐰')+'</div><p class="say ok">'+text+'</p><div class="starline">'+(stars?'拿到 '+stars+' 顆星 '+'⭐'.repeat(stars)+'．':'')+'你有 '+getStars()+' 顆星</div><button class="next" style="margin:0" type="button" data-game="'+game+'">再玩一次</button><button class="gback" type="button" data-gback="1">回遊戲選單</button></div>';
}
let mem=null;
function startMemory(){
  stopGame();
  const picks=take(lessonVoc(),4);
  const cards=shuffle(picks.flatMap((v,n)=>[{pair:n,html:'<span class="emoji">'+v.p+'</span>'},{pair:n,html:zyw(v)}]));
  mem={cards,open:[],flips:0,done:0,lock:false};
  $('main').innerHTML=gameTop('翻牌配對')+'<p class="hint" id="memcount">翻了 0 次</p><div class="memgrid">'+cards.map((c,n)=>'<button class="card" type="button" data-card="'+n+'"><span class="cardback">'+themeOf().icon+'</span></button>').join('')+'</div>';
}
function flipCard(b){
  const n=Number(b.dataset.card),c=mem.cards[n];
  if(mem.lock||b.classList.contains('open')||b.classList.contains('done'))return;
  b.classList.add('open');b.innerHTML=c.html;mem.open.push(b);
  if(mem.open.length<2)return;
  mem.flips++;$('memcount').textContent='翻了 '+mem.flips+' 次';
  const [x,y]=mem.open;mem.open=[];
  if(mem.cards[Number(x.dataset.card)].pair===mem.cards[Number(y.dataset.card)].pair){
    beep(true);[x,y].forEach(e=>{e.classList.remove('open');e.classList.add('done');e.disabled=true});
    mem.done++;
    if(mem.done===4)gTimers.push(setTimeout(()=>gameWin('memory',mem.flips<=6?3:mem.flips<=9?2:1,'全部配對成功！'),500));
  }else{
    mem.lock=true;
    gTimers.push(setTimeout(()=>{[x,y].forEach(e=>{e.classList.remove('open');e.innerHTML='<span class="cardback">'+themeOf().icon+'</span>'});mem.lock=false},900));
  }
}
const MOLE_GOAL=8;
let mo=null;
function nextMoleTarget(){
  const pool=lesson.sym.filter(x=>x[1]);
  mo.target=take(pool,1)[0];
  const t=$('moletarget');if(t)t.textContent=mo.target[0];
  say(mo.target[1]);
}
function startMole(){
  stopGame();
  mo={hits:0,target:null};
  $('main').innerHTML=gameTop('注音打地鼠')+'<div class="ask slim"><span class="word" id="moletarget"></span><button class="speak" type="button" id="molesay">'+SPEAKER+'聽聲音</button></div><p class="hint" id="hint"></p><p class="hint" id="molecount">已經打到 0 隻／共 '+MOLE_GOAL+' 隻</p><div class="field">'+[0,1,2,3,4,5].map(n=>'<button class="hole" type="button" data-hole="'+n+'"></button>').join('')+'</div>';
  nextMoleTarget();
  popMole();
  gTimers.push(setInterval(popMole,1400));
}
function popMole(){
  const holes=[...document.querySelectorAll('.hole')];if(!holes.length||!mo)return;
  holes.forEach(h=>{h.classList.remove('up','hit');h.innerHTML='';delete h.dataset.sym});
  const syms=lesson.sym.map(x=>x[0]).filter(s=>s!==mo.target[0]);
  const spots=take(holes,3);
  [mo.target[0],...take(syms,2)].forEach((s,n)=>{const h=spots[n];if(!h)return;h.classList.add('up');h.dataset.sym=s;h.innerHTML='<span class="mole">'+themeOf().icon+'</span>'+s});
}
function hitMole(b){
  if(!b.dataset.sym)return;
  if(b.dataset.sym===mo.target[0]){
    beep(true);mo.hits++;b.classList.add('hit');delete b.dataset.sym;
    $('molecount').textContent='已經打到 '+mo.hits+' 隻／共 '+MOLE_GOAL+' 隻';
    if(mo.hits>=MOLE_GOAL){gameWin('mole',3,'全部打到了！');return}
    nextMoleTarget();popMole();
  }else{beep(false);b.classList.add('bad');gTimers.push(setTimeout(()=>b.classList.remove('bad'),350))}
}
const RACE_STEPS=8;
let race=null;
function startRace(){
  stopGame();
  race={me:0,rabbit:0,tick:0,q:null};
  $('main').innerHTML=gameTop('龜兔賽跑')+'<div class="track"><div class="lane"><span class="runner" id="me" style="left:0%">🐢</span></div><div class="lane"><span class="runner" id="rb" style="left:0%">🐰</span></div><span class="flag">🏁</span></div><div id="raceq"></div>';
  raceQuestion();
  gTimers.push(setInterval(()=>{
    race.tick++;
    if(race.tick%4===0)return; // 兔子偶爾睡一下
    race.rabbit++;$('rb').style.left=(race.rabbit/RACE_STEPS*85)+'%';
    if(race.rabbit>=RACE_STEPS)gameWin('race',0,'兔子先到了，再試一次！');
  },6000));
}
function raceQuestion(){
  const voc=lessonVoc();
  const w=take(voc,1)[0];
  const opts=shuffle([w,...take(voc.filter(u=>u!==w),2)]);
  race.q={w,opts};
  $('raceq').innerHTML='<div class="ask slim"><span class="pic" role="img" aria-label="'+w.c+'">'+w.p+'</span></div><div class="opts three">'+opts.map((o,n)=>'<button class="cell chunk" type="button" data-race="'+n+'">'+zyw(o)+'</button>').join('')+'</div>';
}
function answerRace(b){
  if(race.q.opts[Number(b.dataset.race)]===race.q.w){
    beep(true);race.me++;$('me').style.left=(race.me/RACE_STEPS*85)+'%';
    if(race.me>=RACE_STEPS){gameWin('race',race.rabbit<4?3:2,'烏龜贏了！');return}
    raceQuestion();
  }else{beep(false);b.classList.add('bad');b.disabled=true}
}
const sheetEl=()=>document.querySelector('.sheet');
const THEMES={
 '1':{img:'images/lesson1.jpg',bg:'#a33a1f',icon:'🐱',pics:['🐱','🏃','🏅','🎽','🌼','🏁','🦀','🐈‍⬛']},
 '2':{img:'images/lesson2.jpg',bg:'#1f6b4a',icon:'🐣',pics:['🐣','🦢','🥚','🐤','🕸️','🐸','🌿','🐥']},
 '3':{img:'images/lesson3.jpg',bg:'#135f8f',icon:'🦫',pics:['🦛','🦫','🐟','🪵','🌊','🌲','💧','🐠']},
 '4':{img:'images/lesson4.jpg',bg:'#8a4a12',icon:'🎒',pics:['🎒','🏫','🦒','🦌','🍂','🌳','🐰','🐦']},
 '5':{img:'images/lesson5.jpg',bg:'#3f7a1e',icon:'🛝',pics:['🛝','🐭','🐰','⚽','🍄','🐱','☁️','🌼']},
 '6':{img:'images/lesson6.jpg',bg:'#a02c6b',icon:'🌷',pics:['🌷','🧑‍🏫','🎨','🙏','🐸','🍄','🍃','🐵']},
 '7':{img:'images/lesson7.jpg',bg:'#2f6d2b',icon:'🐢',pics:['🐢','🐰','🏁','💤','🎵','🐌','🌺','🌳']},
 '8':{img:'images/lesson8.jpg',bg:'#8c5a14',icon:'🥕',pics:['🥕','🐘','🐂','🐰','🐱','☀️','🐛','🌱']},
 '9':{img:'images/lesson9.jpg',bg:'#5a2a96',icon:'🎉',pics:['🎉','🦚','🐸','🥁','🦁','🌙','⭐','🐻']},
 'all':{img:'images/lessonall.jpg',bg:'#2b1a5a',icon:'🏆',pics:['🏆','🐱','🐣','🦫','🎒','🐢','🥕','🎉']}
};
const themeOf=()=>THEMES[lesson.id];
const sceneHtml=()=>themeOf().img?'<img class="sceneimg" src="'+themeOf().img+'" alt="">':'<div class="scene" aria-hidden="true">'+themeOf().pics.slice(0,5).map(p=>'<span>'+p+'</span>').join('')+'</div>';
const SLOTS=[[2,17],[92,17],[2,46],[92,42],[5,88],[89,86],[28,94],[62,94]];
const decorHtml=()=>'<div class="decor" aria-hidden="true">'+themeOf().pics.map((p,n)=>'<span style="left:'+SLOTS[n][0]+'%;top:'+SLOTS[n][1]+'%">'+p+'</span>').join('')+'</div>';
function applyTheme(){
  sheetEl().style.setProperty('--k-bg',themeOf().bg);
  const best=store.get('best-'+lesson.id);
  const ban=$('banner');if(ban)ban.innerHTML=(themeOf().img?'<img class="banimg" src="'+themeOf().img+'" alt="">':'')+'<span class="banpics" aria-hidden="true">'+themeOf().pics.slice(0,4).join('')+'</span><span class="banname">'+lesson.name+' '+lesson.sub+'</span>'+(best!==null?'<small>最高 '+best+' 分</small>':'');
}
function burst(){
  const stage=document.querySelector('.stage');if(!stage)return;
  const b=document.createElement('div');b.className='burst';b.setAttribute('aria-hidden','true');
  b.innerHTML=themeOf().pics.slice(0,6).map((p,n)=>'<span style="left:'+(10+n*15)+'%;animation-delay:'+(n*.06)+'s">'+p+'</span>').join('');
  stage.appendChild(b);
  gTimers.push(setTimeout(()=>b.remove(),1300));
}
const LIVE_SECONDS=30;
const SHAPES=['▲','◆','●','■'];
const duoHtml=ch=>'<span class="duo-line" data-noz>'+ch.map(t=>'<span class="duo">'+t.c+zy(t)+'</span>').join('')+'</span>';
const emojiHtml=p=>'<span class="emoji">'+p+'</span>';
function liveBuild(l){
  const voc=lessonVoc(),count=l.id==='all'?15:10;
  const picks=n=>shuffle(voc).slice(0,n);
  const fourFor=w=>shuffle([w,...shuffle(voc.filter(v=>v!==w)).slice(0,3)]);
  const makers={
    picZy(){const w=picks(1)[0],o=fourFor(w);return {prompt:'<span class="pic" role="img" aria-label="'+w.c+'">'+w.p+'</span>',say:w.c,opts:o.map(zyw),good:o.indexOf(w)}},
    zyPic(){const w=picks(1)[0],o=fourFor(w);return {prompt:'<span class="word">'+zyw(w)+'</span>',opts:o.map(v=>emojiHtml(v.p)),labels:o.map(v=>v.c),good:o.indexOf(w)}},
    charZy(){const w=picks(1)[0],o=fourFor(w);return {prompt:'<span class="pic" role="img" aria-label="'+w.c+'">'+w.p+'</span><span class="word" data-noz>'+w.c+'</span>',say:w.c,opts:o.map(zyw),good:o.indexOf(w)}},
    duoPic(){const w=picks(1)[0],o=fourFor(w);return {prompt:duoHtml(w.ch),say:w.c,opts:o.map(v=>emojiHtml(v.p)),labels:o.map(v=>v.c),good:o.indexOf(w)}},
    listen(){const pool=l.sym.filter(x=>x[1]),t=take(pool,1)[0],o=shuffle([t[0],...take(l.sym.map(x=>x[0]).filter(s=>s!==t[0]),3)]);return {prompt:'',say:t[1],mustListen:true,opts:o,good:o.indexOf(t[0])}},
    sentPic(){const s=take(l.sents,1)[0],others=[...new Set([...l.sents.map(x=>x.p),...voc.map(v=>v.p)])].filter(p=>p!==s.p),o=shuffle([s.p,...take(others,3)]);return {prompt:duoHtml(s.ch.flat()),say:sentText(s),opts:o.map(emojiHtml),labels:o,good:o.indexOf(s.p)}}
  };
  const names=Object.keys(makers),out=[];
  let bag=[];
  while(out.length<count){if(!bag.length)bag=shuffle(names);out.push(makers[bag.pop()]())}
  return out;
}
let live=null;
function liveLobby(){
  stopGame();sheetEl().classList.remove('playing');
  const n=lesson.id==='all'?15:10;
  $('main').innerHTML='<div class="stage klobby">'+decorHtml()+sceneHtml()+'<div class="shapes">'+SHAPES.map((s,k)=>'<span class="kshape'+k+'">'+s+'</span>').join('')+'</div><div class="kbig">注音搶答</div><div class="say">'+lesson.name+' '+lesson.sub+'．共 '+n+' 題</div><button class="kstart" type="button" data-kstart="1">開始</button></div>';
}
function liveStart(){
  live={qs:liveBuild(lesson),i:0,score:0,streak:0,right:0,left:LIVE_SECONDS,locked:false};
  sheetEl().classList.add('playing');
  liveQuestion();
}
function liveQuestion(){
  stopGame();
  const q=live.qs[live.i];live.left=LIVE_SECONDS;live.locked=false;
  const speak=q.say?'<button class="speak" type="button" data-say="'+q.say+'">'+SPEAKER+(q.mustListen?'聽聲音':'念給我聽')+'</button>':'';
  $('main').innerHTML='<div class="stage">'+decorHtml()+'<div class="khead"><button class="kexit" type="button" data-kexit="1">離開</button><span>第 '+(live.i+1)+' 題／共 '+live.qs.length+' 題</span><span class="kscore" id="kscore">'+live.score+'</span></div><div class="ktimer"><i id="kbar"></i></div>'+(q.tag?'<span class="ktag">'+q.tag+'</span>':'')+'<div class="kprompt">'+q.prompt+speak+'</div><p class="hint" id="hint"></p><div class="ktiles">'+q.opts.map((o,n)=>'<button class="ktile k'+n+'" type="button" data-k="'+n+'"'+(q.labels?' aria-label="'+q.labels[n]+'"':'')+'><span class="shape" aria-hidden="true">'+SHAPES[n]+'</span>'+o+'</button>').join('')+'</div><div class="kfb" id="kfb"></div></div>';
  gTimers.push(setInterval(()=>{
    live.left-=.1;
    const bar=$('kbar');if(bar)bar.style.width=Math.max(0,live.left/LIVE_SECONDS*100)+'%';
    if(live.left<=0)liveAnswer(-1);
  },100));
}
function liveAnswer(n){
  if(live.locked)return;
  live.locked=true;stopGame();
  const q=live.qs[live.i],ok=n===q.good;
  document.querySelectorAll('.ktile').forEach((b,k)=>{b.disabled=true;if(k===q.good)b.classList.add('right');else b.classList.add('dim')});
  let text;
  if(ok){
    burst();
    const pts=Math.round(500+500*Math.max(0,live.left)/LIVE_SECONDS)+live.streak*100;
    live.score+=pts;live.right++;live.streak++;
    text='答對了！＋'+pts+' 分'+(live.streak>1?'．連對 '+live.streak+' 題':'');
  }else{live.streak=0;text=n<0?'時間到！':'答錯了，看正確答案。'}
  beep(ok);
  $('kscore').textContent=live.score;
  const last=live.i===live.qs.length-1;
  $('kfb').innerHTML='<p class="say">'+text+'</p><button class="knext" type="button" data-knext="1">'+(last?'看成績':'下一題')+'</button>';
}
function liveEnd(){
  stopGame();
  const total=live.qs.length,max=total*1000;
  const ratio=live.right/total;
  const stars=ratio>=.9?3:ratio>=.6?2:ratio>0?1:0;
  if(stars)addStars(stars);
  const name=$('name').value.trim().replace(/[<>&"]/g,'');
  const rows=[{who:'🧒',label:name||'我',pts:live.score,me:true},{who:'🐱',label:'貓咪',pts:Math.round(max*.62)},{who:'🐰',label:'兔子',pts:Math.round(max*.42)},{who:'🐢',label:'烏龜',pts:Math.round(max*.22)}].sort((a,b)=>b.pts-a.pts);
  const place=rows.findIndex(r=>r.me)+1;
  $('main').innerHTML='<div class="stage klobby">'+decorHtml()+'<div class="kbig">排行榜</div><div class="say">第 '+place+' 名．答對 '+live.right+' 題，共 '+total+' 題'+(stars?'．拿到 '+stars+' 顆星 '+'⭐'.repeat(stars):'')+'</div><div class="board">'+rows.map((r,k)=>'<div class="brow'+(r.me?' me':'')+'"><span class="rank">'+(k+1)+'</span><span class="who" aria-hidden="true">'+r.who+'</span><span>'+r.label+'</span><span class="pts">'+r.pts+'</span></div>').join('')+'</div><button class="kstart" type="button" data-kstart="1">再玩一次</button><button class="kexit" type="button" data-kexit="1">回到選課</button></div>';
}
function renderModes(){document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)))}
$('modes').addEventListener('click',e=>{const b=e.target.closest('.mode');if(!b)return;mode=b.dataset.mode;start(lesson)});
$('main').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.kstart){liveStart();return}
  if(b.dataset.kexit){liveLobby();return}
  if(b.dataset.k!==undefined){liveAnswer(Number(b.dataset.k));return}
  if(b.dataset.knext){if(live.i===live.qs.length-1){sheetEl().classList.remove('playing');liveEnd()}else{live.i++;liveQuestion();$('main').scrollIntoView({block:'start'})}return}
  if(b.dataset.gback){gameMenu();return}
  if(b.dataset.game){({memory:startMemory,mole:startMole,race:startRace})[b.dataset.game]();return}
  if(b.dataset.card!==undefined){flipCard(b);return}
  if(b.dataset.hole!==undefined){hitMole(b);return}
  if(b.dataset.race!==undefined){answerRace(b);return}
  if(b.id==='molesay')say(mo.target[1]);
});
const sheet=document.querySelector('.sheet');
annotate(sheet);
new MutationObserver(()=>annotate(sheet)).observe(sheet,{childList:true,subtree:true});
start(LESSONS[0]);
</script>
